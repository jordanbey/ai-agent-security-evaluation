[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-runtime-eval"
version = "0.1.0"
description = "A model-agnostic research scaffold for AI-agent runtime security evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Jordan Alexander"}]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

agents = [
    "langchain>=1.0,<2.0",
    "langchain-anthropic>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
agent-runtime-eval = "agent_runtime_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
